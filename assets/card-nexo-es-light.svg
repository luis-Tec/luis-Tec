  <!-- Right vector illustration -->
  
  <rect x="312" y="48" width="108" height="94" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="348" cy="84" r="20" fill="none" stroke="#0284C7" stroke-width="7" opacity="0.28"/>
  <circle cx="348" cy="84" r="20" fill="none" stroke="#0284C7" stroke-width="7" stroke-dasharray="99 126" stroke-dashoffset="0" transform="rotate(-90 348 84)"/>
  <circle cx="348" cy="84" r="20" fill="none" stroke="#E11D48" stroke-width="7" stroke-dasharray="26 126" stroke-dashoffset="-100" transform="rotate(-90 348 84)"/>
  <text x="348" y="88" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="9" font-weight="700" fill="#0F172A">20%</text>
  <!-- 3 bars right of donut -->
  <rect x="378" y="68" width="32" height="6" rx="3" fill="#E11D48"/>
  <rect x="378" y="80" width="18" height="6" rx="3" fill="#0284C7"/>
  <rect x="378" y="92" width="17" height="6" rx="3" fill="#0284C7" opacity="0.7"/>
