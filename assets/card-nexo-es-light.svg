  <text x="112.7" y="31.5" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#0284C7">INTELIGENCIA DE NEGOCIOS · EDA</text>

  <!-- External link arrow icon -->
  <path d="M406 23 L415 23 L415 32 M415 23 L405 33" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left text content -->
  <text x="22" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F172A">Deserción y Retención Bancaria</text>
  <text x="22" y="87" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.8" fill="#475569">Análisis integral de churn en 10 mil clientes</text>
  <text x="22" y="104" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.8" fill="#475569">con tablero ejecutivo Power BI de 2 vistas.</text>

  <!-- Metric highlight -->
