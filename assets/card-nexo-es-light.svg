<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="440" height="205" role="img" aria-label="Deserción y Retención Bancaria">
  <defs>
    <clipPath id="cardClip-nexo">
      <rect x="1" y="1" width="438" height="203" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardClip-nexo)">
    <rect x="0" y="0" width="440" height="205" fill="#F8FAFC"/>
    <rect x="0" y="0" width="440" height="3.5" fill="#0284C7"/>
