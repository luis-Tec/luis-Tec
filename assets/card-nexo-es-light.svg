  <rect x="22" y="164" width="62.4" height="21" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="53.2" y="178.0" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E293B">Power BI</text>
  <rect x="91.4" y="164" width="33.4" height="21" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="108.1" y="178.0" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E293B">DAX</text>
  <rect x="131.8" y="164" width="33.4" height="21" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="148.5" y="178.0" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E293B">EDA</text>
  <rect x="172.20000000000002" y="164" width="62.4" height="21" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="203.4" y="178.0" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E293B">Modelado</text>
