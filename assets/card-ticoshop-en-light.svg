  <rect x="79.8" y="164" width="85.6" height="21" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/><text x="122.6" y="178.0" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10" font-weight="600" fill="#1E293B">Scikit-learn</text>
