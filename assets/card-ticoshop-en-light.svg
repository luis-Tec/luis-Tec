  <text x="22" y="87" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.8" fill="#475569">K-Means customer profiling paired with a Decision</text>
  <text x="22" y="104" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.8" fill="#475569">Tree classifier and marketing retention playbook.</text>

