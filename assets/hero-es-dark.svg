<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Luis Armando Castillo López">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#262C36"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="1" y="1" width="898" height="248" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="900" height="250" fill="#161B22"/>
    <rect x="0" y="0" width="900" height="250" fill="url(#dotGrid)" opacity="0.65"/>
    <circle cx="770" cy="40" r="160" fill="#38BDF8" opacity="0.14"/>
    <circle cx="140" cy="230" r="140" fill="#818CF8" opacity="0.14"/>
    <rect x="0" y="0" width="900" height="4" fill="url(#topGrad)"/>
  </g>
  <rect x="1" y="1" width="898" height="248" rx="16" fill="none" stroke="#30363D" stroke-width="1.2"/>

  <!-- Left column -->
  <circle cx="40" cy="39" r="4.5" fill="#34D399"/>
  <circle cx="40" cy="39" r="8" fill="#34D399" opacity="0.22"/>
  <text x="56" y="43" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#8B949E">DISPONIBLE · HEREDIA, COSTA RICA · INGLÉS B2 / ESPAÑOL NATIVO</text>

  <text x="36" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6" fill="#F0F6FC">Luis Armando Castillo López</text>
  <text x="36" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#38BDF8">Ingeniero en Computación  |  Análisis de Datos &amp; BI  |  .NET &amp; Python</text>

  <text x="36" y="150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8B949E">Conectando Inteligencia de Negocios e Ingeniería de Software para</text>
  <text x="36" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8B949E">convertir datos en KPIs accionables y sistemas mantenibles.</text>

  <rect x="36" y="194" width="504" height="30" rx="8" fill="#1C2330" stroke="#262C36" stroke-width="1"/>
  <text x="48" y="213" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#C9D1D9">Bach. Ingeniería en Computación (TEC)  ·  Ciencias de Datos 360h (INCOEX)  ·  CPIC</text>

  <!-- Right Hybrid Telemetry Panel -->
  <rect x="572" y="24" width="298" height="202" rx="13" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>

  <!-- Mini-panel 1: Data & BI -->
  <rect x="586" y="38" width="270" height="82" rx="9" fill="#1C2330" stroke="#262C36" stroke-width="1"/>
  <circle cx="599" cy="53" r="3.5" fill="#38BDF8"/>
  <text x="610" y="57" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#8B949E">TELEMETRÍA DATOS &amp; BI</text>
  <text x="598" y="75" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#F0F6FC">20.37% Churn  ·  86.17% ML</text>
  <!-- Sparkline -->
  <path d="M598 108 L630 101 L662 104 L694 94 L726 97 L758 84 L790 88 L822 72 L844 76 L844 112 L598 112 Z" fill="url(#sparkFill)"/>
  <path d="M598 108 L630 101 L662 104 L694 94 L726 97 L758 84 L790 88 L822 72 L844 76" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="822" cy="72" r="3" fill="#34D399"/>
  <circle cx="844" cy="76" r="2.5" fill="#38BDF8"/>

  <!-- Mini-panel 2: Software -->
  <rect x="586" y="130" width="270" height="82" rx="9" fill="#1C2330" stroke="#262C36" stroke-width="1"/>
  <circle cx="599" cy="145" r="3.5" fill="#818CF8"/>
  <text x="610" y="149" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="9.5" font-weight="700" letter-spacing="0.6" fill="#8B949E">ARQUITECTURA SOFTWARE</text>
  <text x="598" y="170" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="11" fill="#818CF8">stack<tspan fill="#8B949E"> = &#123;</tspan><tspan fill="#34D399">&quot;ASP.NET Core&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#34D399">&quot;.NET 9&quot;</tspan><tspan fill="#8B949E">&#125;</tspan></text>
  <text x="598" y="188" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="11" fill="#38BDF8">data<tspan fill="#8B949E">  = [</tspan><tspan fill="#FBBF24">&quot;Python&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#FBBF24">&quot;Power BI&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#FBBF24">&quot;SQL&quot;</tspan><tspan fill="#8B949E">]</tspan></text>
  <text x="598" y="203" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="9.5" fill="#6E7681">// clean architecture · measurable KPIs</text>
</svg>
